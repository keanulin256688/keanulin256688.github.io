<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的皮卡丘冒險基地</title>
    <style>
        /* 整體背景使用皮卡丘黃 */
        body {
            background-color: #FFDE00;
            font-family: "Arial", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #3B4CCA; /* 寶可夢經典藍色 */
        }

        /* 容器美化 */
        .container {
            background-color: white;
            border: 8px solid #000; /* 黑色邊框像皮卡丘耳朵 */
            border-radius: 30px;
            padding: 30px;
            box-shadow: 10px 10px 0px #CC0000; /* 紅色陰影 */
            max-width: 600px;
            text-align: center;
        }

        /* 文字美化 */
        .big-text {
            font-size: 40px;
            font-weight: bold;
            text-shadow: 2px 2px #FFDE00;
            margin: 10px 0;
        }

        .small-text {
            font-size: 14px;
            color: #555;
            background: #fdfd96;
            padding: 5px;
            border-radius: 5px;
        }

        h1.hawk {
            color: #4CAF50;
            font-size: 60px;
            margin-top: 20px;
            -webkit-text-stroke: 2px #000;
        }

        .mystic-text {
            color: #808080;
            font-size: 14px;
            font-style: italic;
        }

        /* 圖片美化 */
        img {
            border-radius: 15px;
            margin: 10px;
            transition: transform 0.3s;
            border: 3px solid #FFDE00;
        }

        img:hover {
            transform: scale(1.1) rotate(5deg); /* 滑鼠移上去會跳動一下 */
            border-color: #CC0000;
        }

        /* 按鈕美化 */
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #FFDE00;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 50px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #CC0000;
            color: white;
            box-shadow: 0px 5px 0px #000;
        }

        /* 寶可球旋轉動畫 */
        .pokeball {
            transition: 0.5s;
        }

        .pokeball:hover {
            transform: rotate(360deg);
        }

    </style>
</head>
<body>

    <div class="container">
        <p class="big-text">我是 40 像素的大字</p>
        <p class="small-text">我是 10 像素的小字</p>
        
        <h1 class="hawk">I am green Hawk</h1>
        <p class="mystic-text">我是一個灰色的神祕小精靈</p>

        <hr border="1">

        <div>
            <img src="picture/p01.jpg" alt="pikachu" width="150px">
            <img src="picture/p02.png" alt="blue charizard" width="150px">
        </div>
        
        <div>
            <img src="picture/p01.jpg" width="100px" alt="pikachu">
            <img src="picture/p02.png" width="100px" alt="blue charizard">
        </div>

        <br>

        <a href="https://cpaizo.github.io/students/%E7%AB%AF%E5%8D%88%E7%AF%80%E7%B6%B2%E9%A0%81%E5%BC%B5%E5%AE%9A%E5%9F%8E.html" class="btn">⚡ 點我飛往 game</a>
        <a href="https://searchplayground.google/pacman/halloween/?hl=zh-tw&gl=tw" class="btn">🏠 我的第二個秘密基地</a>

        <br><br>

        <a href="https://tw.portal-pokemon.com/play/pokedex/">
            <img src="picture/ball.png" width="200px" class="pokeball" title="打開圖鑑！">
        </a>
    </div>

</body>
</html>
