<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>16x16 圖案串聯跑馬燈編輯器 (新細明體一般字版)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --accent-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .left-panel, .right-panel {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .left-panel {
      flex: 1 1 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .right-panel {
      flex: 1 1 450px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tool-section {
      width: 100%;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-section h4 {
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .controls-row {
      width: 100%;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: bold;
      font-size: 0.85rem;
    }

    select, input[type="text"], input[type="password"] {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .color-preview-box {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #fff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.secondary {
      background-color: #475569;
    }

    button.secondary:hover {
      background-color: #334155;
    }

    button.rainbow-btn {
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00ffff, #0000ff, #8b00ff, #ff007f);
      color: white;
      text-shadow: 1px 1px 2px #000;
      font-weight: bold;
    }

    button.rainbow-btn:hover {
      opacity: 0.9;
    }

    button.play-btn {
      background-color: var(--accent-color);
    }

    button.play-btn:hover {
      background-color: #059669;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 2px;
      background-color: #000;
      padding: 4px;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      user-select: none;
      position: relative;
    }

    .pixel {
      background-color: #111;
      border-radius: 2px;
      cursor: pointer;
    }

    .pixel:hover {
      outline: 1px solid rgba(255, 255, 255, 0.8);
    }

    textarea {
      width: 100%;
      height: 320px;
      background-color: #090d16;
      color: #a5f3fc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      resize: vertical;
      outline: none;
      white-space: pre;
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text !important;
    }

    .rgb-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .rgb-inputs input {
      width: 50px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>➡️ 16x16 圖案串聯跑馬燈編輯器 (新細明體版)</h1>
    <p>中英文文字生成、16 條固定螢幕位置彩虹、Code 自由貼上還原與作品儲存！</p>
  </header>

  <div class="main-layout">
    <!-- 左側繪圖與控制區 -->
    <div class="left-panel">
      
      <!-- 存檔與載入區 -->
      <div class="tool-section">
        <h4>☁️ 作品儲存與密碼載入</h4>
        <div class="controls-row">
          <input type="text" id="projectName" placeholder="作品名稱..." style="width: 140px;">
          <input type="password" id="projectPass" placeholder="設定密碼" style="width: 100px;">
          <button id="saveProjectBtn">💾 儲存作品</button>
        </div>
        <div class="controls-row">
          <input type="text" id="loadProjectName" placeholder="輸入作品名稱..." style="width: 140px;">
          <input type="password" id="loadPass" placeholder="解鎖密碼" style="width: 100px;">
          <button class="secondary" id="loadProjectBtn">📂 載入作品</button>
        </div>
      </div>

      <!-- 文字自動生成器 -->
      <div class="tool-section">
        <h4>🔤 中英文文字轉像素圖案</h4>
        <div class="controls-row">
          <input type="text" id="textInput" placeholder="輸入文字 (例如: Hello / 哈囉)" style="width: 180px;">
          <div class="select-group">
            <label>字型:</label>
            <select id="fontSelect">
              <option value="PMingLiU" selected>新細明體</option>
              <option value="Microsoft JhengHei">微軟正黑體</option>
              <option value="DFKai-SB">標楷體</option>
              <option value="Arial">Arial (英)</option>
            </select>
          </div>
          <button id="generateTextBtn">✨ 生成文字圖案</button>
        </div>
      </div>

      <!-- 控制列 1：選擇畫板數量與當前畫板 -->
      <div class="controls-row">
        <div class="select-group">
          <label for="totalFramesSelect">📏 畫板總數：</label>
          <select id="totalFramesSelect"></select>
        </div>

        <div class="select-group">
          <label for="boardSelect">🖼️ 當前畫板：</label>
          <select id="boardSelect"></select>
        </div>
      </div>

      <!-- 控制列 2：調色盤與 RGB -->
      <div class="controls-row">
        <div class="select-group">
          <label for="colorSelect">🎨 筆刷：</label>
          <select id="colorSelect"></select>
          <div id="colorPreview" class="color-preview-box"></div>
        </div>

        <div class="rgb-inputs">
          <label>RGB:</label>
          <input type="number" id="customR" min="0" max="38" value="38" placeholder="R">
          <input type="number" id="customG" min="0" max="38" value="0" placeholder="G">
          <input type="number" id="customB" min="0" max="38" value="0" placeholder="B">
          <button class="secondary" id="applyRgbBtn">自訂色</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="btn-group">
          <button id="playBtn" class="play-btn">▶️ 連貫跑馬燈預覽</button>
          <button class="rainbow-btn" id="rainbowBtn">🌈 啟用螢幕 16 條過場彩虹</button>
          <button class="secondary" id="clearBtn">清空當前畫板</button>
        </div>
      </div>

      <!-- 16x16 畫布 -->
      <div class="grid-container" id="grid"></div>
    </div>

    <!-- 右側程式碼區 -->
    <div class="right-panel">
      <div class="controls-row">
        <h3>💻 MicroPython 程式碼</h3>
        <div class="btn-group">
          <button class="secondary" id="clearCodeBtn">🧹 清空文字框</button>
          <button id="copyBtn">一鍵複製 Code</button>
        </div>
      </div>

      <!-- 可自由編輯、輸入、貼上的文字框 -->
      <textarea id="codeOutput" placeholder="在點擊這裡，可以直接貼上之前儲存的 MicroPython 程式碼..."></textarea>

      <button id="importCodeBtn" style="width: 100%; background-color: #8b5cf6; margin-top: 5px;">📥 從程式碼匯入圖案 (貼上 Code 後按此)</button>
    </div>
  </div>
</div>

<script>
  let PALETTE = [
    { id: 0,  name: "0. 關閉 (黑色)", rgb: [0, 0, 0] },
    { id: 1,  name: "1. 正紅色 (Red)", rgb: [38, 0, 0] },
    { id: 2,  name: "2. 正綠色 (Green)", rgb: [0, 38, 0] },
    { id: 3,  name: "3. 正藍色 (Blue)", rgb: [0, 0, 38] },
    { id: 4,  name: "4. 金黃色 (Yellow)", rgb: [38, 38, 0] },
    { id: 5,  name: "5. 青藍色 (Cyan)", rgb: [0, 38, 38] },
    { id: 6,  name: "6. 洋紅色 (Magenta)", rgb: [38, 0, 38] },
    { id: 7,  name: "7. 鮮橙色 (Orange)", rgb: [38, 19, 0] },
    { id: 8,  name: "8. 紫羅蘭 (Violet)", rgb: [19, 0, 38] },
    { id: 9,  name: "9. 玫瑰粉 (Pink)", rgb: [38, 0, 19] },
    { id: 10, name: "10. 純白色 (White)", rgb: [38, 38, 38] }
  ];

  const RAINBOW_16_RGB = [];
  for (let i = 0; i < 16; i++) {
    const hue = (i / 16) * 360;
    RAINBOW_16_RGB.push(hsvToRgb(hue, 100, 100));
  }

  function hsvToRgb(h, s, v) {
    let r, g, b;
    s /= 100; v /= 100;
    let c = v * s;
    let x = c * (1 - Math.abs((h / 60) % 2 - 1));
    let m = v - c;

    if (h >= 0 && h < 60) { r = c; g = x; b = 0; }
    else if (h >= 60 && h < 120) { r = x; g = c; b = 0; }
    else if (h >= 120 && h < 180) { r = 0; g = c; b = x; }
    else if (h >= 180 && h < 240) { r = 0; g = x; b = c; }
    else if (h >= 240 && h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }

    return [
      Math.round((r + m) * 38),
      Math.round((g + m) * 38),
      Math.round((b + m) * 38)
    ];
  }

  let maxAllowedFrames = 3;
  let framesData = Array(15).fill(0).map(() => Array(16).fill(0).map(() => Array(16).fill(0)));
  let currentFrameIndex = 0;
  let currentColorId = 1;
  let isMouseDown = false;
  let isEditingCode = false;
  let playTimer = null;
  let isPlaying = false;
  let scrollOffsetX = 0;
  let useScreenRainbow = false;

  const totalFramesSelectEl = document.getElementById('totalFramesSelect');
  const boardSelectEl = document.getElementById('boardSelect');
  const colorSelectEl = document.getElementById('colorSelect');
  const colorPreviewEl = document.getElementById('colorPreview');
  const gridEl = document.getElementById('grid');
  const codeOutputEl = document.getElementById('codeOutput');
  const playBtn = document.getElementById('playBtn');

  codeOutputEl.addEventListener('focus', () => { isEditingCode = true; });
  codeOutputEl.addEventListener('blur', () => { isEditingCode = false; });

  function initTotalFramesSelect() {
    totalFramesSelectEl.innerHTML = '';
    for (let i = 1; i <= 15; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `共 ${i} 個畫板`;
      if (i === 3) opt.selected = true;
      totalFramesSelectEl.appendChild(opt);
    }

    totalFramesSelectEl.addEventListener('change', (e) => {
      maxAllowedFrames = parseInt(e.target.value);
      if (currentFrameIndex >= maxAllowedFrames) {
        currentFrameIndex = maxAllowedFrames - 1;
      }
      updateBoardSelectOptions();
      renderCurrentFrameGrid();
      generateCode();
    });
  }

  function updateBoardSelectOptions() {
    boardSelectEl.innerHTML = '';
    for (let i = 0; i < maxAllowedFrames; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `畫板 ${i + 1}`;
      if (i === currentFrameIndex) opt.selected = true;
      boardSelectEl.appendChild(opt);
    }
  }

  boardSelectEl.addEventListener('change', (e) => {
    stopPreview();
    currentFrameIndex = parseInt(e.target.value);
    renderCurrentFrameGrid();
  });

  function initColorSelect() {
    colorSelectEl.innerHTML = '';
    PALETTE.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = item.name;
      if (item.id === currentColorId) opt.selected = true;
      colorSelectEl.appendChild(opt);
    });

    updateColorPreview();
    colorSelectEl.addEventListener('change', (e) => {
      currentColorId = parseInt(e.target.value);
      updateColorPreview();
    });
  }

  function updateColorPreview() {
    const color = PALETTE.find(p => p.id === currentColorId) || { rgb: [38, 0, 0] };
    const [r, g, b] = color.rgb;
    colorPreviewEl.style.backgroundColor = `rgb(${r * 6}, ${g * 6}, ${b * 6})`;
  }

  document.getElementById('applyRgbBtn').addEventListener('click', () => {
    const r = Math.min(38, Math.max(0, parseInt(document.getElementById('customR').value) || 0));
    const g = Math.min(38, Math.max(0, parseInt(document.getElementById('customG').value) || 0));
    const b = Math.min(38, Math.max(0, parseInt(document.getElementById('customB').value) || 0));

    const newId = PALETTE.length;
    const customColor = { id: newId, name: `${newId}. 自訂色 (${r},${g},${b})`, rgb: [r, g, b] };
    PALETTE.push(customColor);
    
    currentColorId = newId;
    initColorSelect();
  });

  function initGridUI() {
    gridEl.innerHTML = '';
    for (let y = 0; y < 16; y++) {
      for (let x = 0; x < 16; x++) {
        const pixel = document.createElement('div');
        pixel.classList.add('pixel');
        pixel.dataset.x = x;
        pixel.dataset.y = y;

        pixel.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          stopPreview();
          isMouseDown = true;
          const currentPixelColor = framesData[currentFrameIndex][y][x];
          if (currentPixelColor === currentColorId) {
            paintPixel(x, y, pixel, 0);
          } else {
            paintPixel(x, y, pixel, currentColorId);
          }
        });

        pixel.addEventListener('mouseenter', () => {
          if (isMouseDown) {
            paintPixel(x, y, pixel, currentColorId);
          }
        });

        gridEl.appendChild(pixel);
      }
    }

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    renderCurrentFrameGrid();
  }

  function renderCurrentFrameGrid() {
    const pixels = gridEl.querySelectorAll('.pixel');
    pixels.forEach(p => {
      const x = parseInt(p.dataset.x);
      const y = parseInt(p.dataset.y);
      const colorId = framesData[currentFrameIndex][y][x];
      
      let r, g, b;
      if (colorId !== 0 && useScreenRainbow) {
        [r, g, b] = RAINBOW_16_RGB[x];
      } else {
        const color = PALETTE.find(item => item.id === colorId) || { rgb: [0, 0, 0] };
        [r, g, b] = color.rgb;
      }
      p.style.backgroundColor = colorId === 0 ? '#111' : `rgb(${r * 6}, ${g * 6}, ${b * 6})`;
    });
    boardSelectEl.value = currentFrameIndex;
  }

  function paintPixel(x, y, el, targetColorId) {
    framesData[currentFrameIndex][y][x] = targetColorId;
    renderCurrentFrameGrid();
    generateCode();
  }

  document.getElementById('rainbowBtn').addEventListener('click', () => {
    useScreenRainbow = !useScreenRainbow;
    renderCurrentFrameGrid();
    generateCode();
    alert(useScreenRainbow ? "🌈 已啟用螢幕彩虹過場！" : "已關閉彩虹，恢復預設筆刷顏色。");
  });

  // 🔤 文字生成 (設為一般粗細 + 新細明體)
  document.getElementById('generateTextBtn').addEventListener('click', () => {
    const text = document.getElementById('textInput').value;
    const font = document.getElementById('fontSelect').value;
    if (!text) return alert("請輸入文字！");

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    const neededBoards = Math.min(15, Math.max(1, Math.ceil((text.length * 13) / 16)));
    maxAllowedFrames = neededBoards;
    totalFramesSelectEl.value = maxAllowedFrames;
    updateBoardSelectOptions();

    const canvasWidth = maxAllowedFrames * 16;
    canvas.width = canvasWidth;
    canvas.height = 16;

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvasWidth, 16);
    ctx.fillStyle = "white";
    
    // 文字改為 normal 一般粗細
    ctx.font = `normal 12px ${font}`;
    ctx.textBaseline = "middle";
    ctx.fillText(text, 0, 8);

    const imgData = ctx.getImageData(0, 0, canvasWidth, 16).data;
    framesData = Array(15).fill(0).map(() => Array(16).fill(0).map(() => Array(16).fill(0)));

    for (let board = 0; board < maxAllowedFrames; board++) {
      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          const canvasX = board * 16 + x;
          const imgIndex = (y * canvasWidth + canvasX) * 4;
          const brightness = imgData[imgIndex];
          if (brightness > 120) {
            framesData[board][y][x] = currentColorId;
          }
        }
      }
    }

    renderCurrentFrameGrid();
    generateCode();
    alert(`✨ 已成功生成文字圖案！`);
  });

  // 💾 儲存作品
  document.getElementById('saveProjectBtn').addEventListener('click', () => {
    const name = document.getElementById('projectName').value.trim();
    const pass = document.getElementById('projectPass').value.trim();

    if (!name || !pass) return alert("請填寫「作品名稱」與「設定密碼」！");

    const payload = {
      name: name,
      password: pass,
      maxAllowedFrames: maxAllowedFrames,
      framesData: framesData,
      palette: PALETTE,
      useScreenRainbow: useScreenRainbow
    };

    localStorage.setItem(`LED_PROJECT_${name}`, JSON.stringify(payload));
    alert(`🎉 作品「${name}」已成功儲存！`);
  });

  // 📂 載入作品
  document.getElementById('loadProjectBtn').addEventListener('click', () => {
    const name = document.getElementById('loadProjectName').value.trim();
    const pass = document.getElementById('loadPass').value.trim();

    if (!name || !pass) return alert("請輸入「作品名稱」與「解鎖密碼」！");

    const savedData = localStorage.getItem(`LED_PROJECT_${name}`);
    if (!savedData) return alert("❌ 找不到此作品名稱！");

    const data = JSON.parse(savedData);
    if (data.password !== pass) return alert("❌ 密碼錯誤！");

    maxAllowedFrames = data.maxAllowedFrames;
    framesData = data.framesData;
    if (data.palette) PALETTE = data.palette;
    useScreenRainbow = !!data.useScreenRainbow;

    totalFramesSelectEl.value = maxAllowedFrames;
    currentFrameIndex = 0;
    updateBoardSelectOptions();
    initColorSelect();
    renderCurrentFrameGrid();
    generateCode();

    alert(`📂 成功載入作品：「${data.name}」！`);
  });

  // 🧹 清空 Code 文字框
  document.getElementById('clearCodeBtn').addEventListener('click', () => {
    codeOutputEl.value = '';
    codeOutputEl.focus();
  });

  // 📥 從 Code 貼上匯入
  document.getElementById('importCodeBtn').addEventListener('click', () => {
    const rawCode = codeOutputEl.value;
    if (!rawCode) return alert("請先在輸入框內貼上 MicroPython 程式碼！");

    try {
      const boardsMatch = rawCode.match(/BOARDS\s*=\s*\[([\s\S]*?)\]\n\nTOTAL_BOARDS/);
      if (!boardsMatch) return alert("解析失敗！請確認貼入的是由此編輯器生成的 Python 程式碼。");

      const parsedBoards = eval("[" + boardsMatch[1] + "]");

      maxAllowedFrames = parsedBoards.length;
      framesData = Array(15).fill(0).map(() => Array(16).fill(0).map(() => Array(16).fill(0)));

      for (let b = 0; b < maxAllowedFrames; b++) {
        framesData[b] = parsedBoards[b];
      }

      useScreenRainbow = rawCode.includes("RAINBOW_PALETTE = [");

      totalFramesSelectEl.value = maxAllowedFrames;
      currentFrameIndex = 0;
      updateBoardSelectOptions();
      initColorSelect();
      renderCurrentFrameGrid();
      generateCode();

      alert(`🎉 成功解析並還原 ${maxAllowedFrames} 個畫板圖案！`);
    } catch (err) {
      alert("解析失敗！請確保貼上的程式碼沒有遺漏括號。");
    }
  });

  // 跑馬燈播放
  playBtn.addEventListener('click', () => {
    isPlaying ? stopPreview() : startPreview();
  });

  function startPreview() {
    isPlaying = true;
    playBtn.textContent = '⏹️ 停止';
    playBtn.style.backgroundColor = '#ef4444';
    scrollOffsetX = 0;

    const totalWidth = maxAllowedFrames * 16;
    const maxScroll = totalWidth + 16;

    playTimer = setInterval(() => {
      renderPreviewFrame(scrollOffsetX);
      scrollOffsetX = (scrollOffsetX + 1) % maxScroll;
    }, 80);
  }

  function stopPreview() {
    if (isPlaying) {
      isPlaying = false;
      clearInterval(playTimer);
      playBtn.textContent = '▶️ 連貫跑馬燈預覽';
      playBtn.style.backgroundColor = 'var(--accent-color)';
      renderCurrentFrameGrid();
    }
  }

  function renderPreviewFrame(offsetX) {
    const pixels = gridEl.querySelectorAll('.pixel');
    const totalWidth = maxAllowedFrames * 16;

    pixels.forEach(p => {
      const screenX = parseInt(p.dataset.x);
      const y = parseInt(p.dataset.y);
      const worldX = offsetX + screenX - 16;

      let colorId = 0;
      if (worldX >= 0 && worldX < totalWidth) {
        const boardIdx = Math.floor(worldX / 16);
        const localX = worldX % 16;
        colorId = framesData[boardIdx][y][localX];
      }

      let r, g, b;
      if (colorId !== 0 && useScreenRainbow) {
        [r, g, b] = RAINBOW_16_RGB[screenX];
      } else {
        const color = PALETTE.find(item => item.id === colorId) || { rgb: [0, 0, 0] };
        [r, g, b] = color.rgb;
      }

      p.style.backgroundColor = colorId === 0 ? '#111' : `rgb(${r * 6}, ${g * 6}, ${b * 6})`;
    });
  }

  function generateCode() {
    if (isEditingCode) return;

    let pythonCode = `from microbit import *\nimport neopixel\n\nnp = neopixel.NeoPixel(pin16, 256)\n\n`;

    if (useScreenRainbow) {
      pythonCode += `RAINBOW_PALETTE = [\n`;
      RAINBOW_16_RGB.forEach((rgb, idx) => {
        pythonCode += `    (${rgb[0]}, ${rgb[1]}, ${rgb[2]}), # 欄位 ${idx + 1}\n`;
      });
      pythonCode += `]\n\n`;
    } else {
      pythonCode += `PALETTE = {\n`;
      PALETTE.forEach(p => {
        if (p.id > 0) {
          pythonCode += `    ${p.id}: (${p.rgb[0]}, ${p.rgb[1]}, ${p.rgb[2]}),\n`;
        }
      });
      pythonCode += `}\n\n`;
    }

    pythonCode += `BOARDS = [\n`;

    for (let f = 0; f < maxAllowedFrames; f++) {
      pythonCode += `    # --- 畫板 ${f + 1} ---\n    [\n`;
      for (let y = 0; y < 16; y++) {
        pythonCode += "        [" + framesData[f][y].join(", ") + "]" + (y < 15 ? ",\n" : "\n");
      }
      pythonCode += `    ]${f < maxAllowedFrames - 1 ? "," : ""}\n`;
    }

    pythonCode += `]\n\nTOTAL_BOARDS = ${maxAllowedFrames}\nTOTAL_WIDTH = TOTAL_BOARDS * 16\n\ndef get_pixel_index(x, y):\n    return y * 16 + (15 - x) if y % 2 == 0 else y * 16 + x\n\noffset_x = 0\nwhile True:\n    np.fill((0, 0, 0))\n    \n    for screen_x in range(16):\n        world_x = offset_x + screen_x - 16\n        \n        if 0 <= world_x < TOTAL_WIDTH:\n            board_idx = world_x // 16\n            local_x = world_x % 16\n            \n            for y in range(16):\n                color_id = BOARDS[board_idx][y][local_x]\n                if color_id != 0:\n                    idx = get_pixel_index(screen_x, y)\n`;

    if (useScreenRainbow) {
      pythonCode += `                    np[idx] = RAINBOW_PALETTE[screen_x]\n`;
    } else {
      pythonCode += `                    if color_id in PALETTE:\n                        np[idx] = PALETTE[color_id]\n`;
    }

    pythonCode += `                    \n    np.show()\n    sleep(100)\n    \n    offset_x += 1\n    if offset_x >= TOTAL_WIDTH + 16:\n        offset_x = 0\n`;

    codeOutputEl.value = pythonCode;
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    stopPreview();
    framesData[currentFrameIndex] = Array(16).fill(0).map(() => Array(16).fill(0));
    renderCurrentFrameGrid();
    generateCode();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    codeOutputEl.select();
    document.execCommand('copy');
    alert('已成功複製 MicroPython 程式碼！');
  });

  initTotalFramesSelect();
  updateBoardSelectOptions();
  initColorSelect();
  initGridUI();
  generateCode();
</script>

</body>
</html>
